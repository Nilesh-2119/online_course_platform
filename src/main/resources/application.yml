spring:
  application:
    name: course-platform-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # JPA & Hibernate Settings
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  # Flyway Migration Settings
  flyway:
    enabled: false

  # Mail SMTP Configuration for Email OTP
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # Spring Security OAuth2 Client Configuration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder-google-client-secret}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

  # Multipart File Upload Settings
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

# Server Configuration
server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  servlet:
    context-path: /

# Actuator & Observability
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE:health,info}
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    info:
      enabled: true
  info:
    build:
      enabled: true

# Application Custom Properties
app:
  admin-email: ${ADMIN_EMAIL:adfixstudio25@gmail.com}
  uploads:
    dir: ${FILE_UPLOAD_DIR:uploads/resources}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://adfixstudio.com,https://www.adfixstudio.com,https://lighthousedashboard.adfixstudio.com,http://localhost:3000,http://localhost:5173}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600
  security:
    jwt:
      secret: ${JWT_SECRET:defaultSecretKeyForDevelopmentMustBeChangedInProduction32BytesLong}
      access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:900}
      refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:604800}
  auth:
    otp:
      ttl-seconds: ${OTP_TTL_SECONDS:300}
      length: ${OTP_LENGTH:6}
      max-attempts: ${OTP_MAX_ATTEMPTS:3}
      resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
      max-resends-per-window: ${OTP_MAX_RESENDS_PER_WINDOW:5}
    oauth2:
      google:
        client-id: ${GOOGLE_CLIENT_ID:placeholder-google-client-id}
        client-secret: ${GOOGLE_CLIENT_SECRET:placeholder-google-client-secret}
        frontend-callback-url: ${OAUTH2_FRONTEND_CALLBACK_URL:${FRONTEND_URL:https://www.adfixstudio.com}/dashboard}
  payment:
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  video:
    vdocipher:
      api-secret: ${VDOCIPHER_API_SECRET:}
      otp-ttl-seconds: ${VDOCIPHER_OTP_TTL:300}
      whitelist-url: ${VDOCIPHER_WHITELIST_URL:}
      connect-timeout-ms: ${VDOCIPHER_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${VDOCIPHER_READ_TIMEOUT_MS:5000}
